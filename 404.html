  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Consentement REFUSÉ par défaut : aucun cookie de mesure d'audience avant accord explicite
  gtag('consent', 'default', {
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'analytics_storage': 'denied',
    'wait_for_update': 500
  });

  // Restaure un consentement déjà accordé lors d'une visite précédente
  try {
    if (localStorage.getItem('cookieConsent') === 'granted') {
      gtag('consent', 'update', { 'analytics_storage': 'granted' });
    }
  } catch (e) {}

  gtag('js', new Date());
  gtag('config', 'G-K46004C3VR', { 'anonymize_ip': true });
  </script>
